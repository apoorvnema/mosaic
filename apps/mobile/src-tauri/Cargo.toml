# Tauri scaffolding. The application is TypeScript; this crate only starts the
# WebView and registers plugins. Do not add application logic here (see CLAUDE.md).
[package]
name = "mosaic-mobile"
version = "0.1.0"
description = "Mosaic mobile shell"
edition = "2021"

[lib]
name = "mosaic_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
# Needed by code Tauri generates from the `plugins` section of tauri.conf.json.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
