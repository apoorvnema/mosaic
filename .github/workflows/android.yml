name: Build Android

# Scaffolded in the bootstrap session and not yet proven green. The Android
# project is generated here by `tauri android init` until it is committed in the
# Android session (docs/adr/0007).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # --ignore-scripts: better-sqlite3 is test-only and not part of the app.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image ships the Android SDK and NDK; use them as they are.
      - run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: pnpm --filter @mosaic/mobile tauri android init
      - run: pnpm --filter @mosaic/mobile tauri android build --apk --debug
      - name: Name the APK after the version
        run: |
          version="$(node -p "require('./package.json').version")"
          apk="$(find apps/mobile/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)"
          cp "$apk" "Mosaic_${version}_android-debug.apk"
      - name: Publish to the GitHub release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-release.sh Mosaic_*_android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mosaic-android-debug
          retention-days: 7
          path: Mosaic_*_android-debug.apk
