name: Build web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mosaic/web build
      - name: Zip the bundle
        run: |
          version="$(node -p "require('./package.json').version")"
          (cd apps/web/dist && zip -qr "$GITHUB_WORKSPACE/mosaic-web-${version}.zip" .)
      - name: Publish to the GitHub release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-release.sh mosaic-web-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mosaic-web
          retention-days: 7
          path: apps/web/dist
